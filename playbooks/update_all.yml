- hosts: VM
  gather_facts: false
  serial: 1
  become: true
  vars:
    ansible_become_password: "{{ lookup('ansible.builtin.file', '/home/sociodicy/scripts/ansible/secrets/vm_pass.yml') }}"
  roles:
    - apt_update_vm

- name: Upgrade lxcs
  hosts: lxc
  gather_facts: false
  serial: 1
  roles:
    - apt_update_lxc

- name: Upgrade Proxmox Virtual Environment
  hosts: PVE
  gather_facts: false
  serial: 1
  roles:
    - apt_update_lxc

- name: Update and upgrade RPI OSes
  hosts: Pi-holes
  roles:
    - apt_update_rpi

- name: Update and upgrade pihole software
  hosts: Pi-holes
  gather_facts: false
  serial: 1
  become: true
  roles:
    - pihole_up

- name: Update and upgrade vaultwarden family server
  hosts: VW
  gather_facts: false
  serial: 1
  roles:
    - apt_update_special
